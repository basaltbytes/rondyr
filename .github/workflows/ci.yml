name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Quality checks and Worker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Also builds the documentation site in apps/docs and checks its links.
      - run: pnpm check
      - run: pnpm deploy:dry
      # The documentation site that pnpm check built, to read a pull request's pages.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-site
          path: apps/docs/dist/
          if-no-files-found: error
          retention-days: 7

  # Which workspace packages changed, compared with the commit of the last successful
  # prod deployment (push) or the base of the pull request. Comparing with the last
  # deployment, not the previous commit, keeps a Worker change whose own run failed or
  # was cancelled in the next deployment. Pull request checks run on every package
  # anyway; on main, the result decides whether the Worker deploys. Read it in the job
  # log and in the run's notices.
  scope:
    name: Changed packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Read the earlier runs to find the last prod deployment.
      actions: read
    outputs:
      worker: ${{ steps.scope.outputs.worker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so the comparison commit is present.
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: scope
        name: Detect changed packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '--last-deployment' }}
        run: node scripts/deploy-scope.mjs "$BASE"

  dashboard-e2e:
    name: Dashboard browser tests
    # They run upstream, and in a fork set up for the Alchemy path, which the variable
    # BETTER_AUTH_URL_PROD marks: the production job below needs them. A copy made by the
    # Deploy to Cloudflare button deploys through Workers Builds and skips them, which
    # saves several minutes of Actions on each push; the repository variable
    # RONDYR_BROWSER_TESTS=true runs them there too.
    if: >-
      github.repository == 'basaltbytes/rondyr' || vars.BETTER_AUTH_URL_PROD != '' ||
      vars.RONDYR_BROWSER_TESTS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter rondyr exec playwright install --with-deps --only-shell chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: dashboard-browser-traces
          path: apps/rondyr/test-results/
          if-no-files-found: ignore

  production:
    # Deploys prod with Alchemy after both test jobs pass, then checks its /health. A push
    # deploys unless the scope job answered that the Worker package did not change: when
    # that job fails, the push deploys, as for any doubt.
    # - basaltbytes/rondyr: BETTER_AUTH_URL_PROD is set and the browser tests run, so a
    #   push to main deploys.
    # - A fork set up for the Alchemy path: the same, once its Alchemy settings are set.
    # - A copy made by the button: no BETTER_AUTH_URL_PROD, so this job never runs, even
    #   when RONDYR_BROWSER_TESTS runs the browser tests; Workers Builds deploys it.
    name: Production
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.BETTER_AUTH_URL_PROD != '' &&
      needs.check.result == 'success' && needs.dashboard-e2e.result == 'success' &&
      needs.scope.outputs.worker != 'false'
    needs: [check, dashboard-e2e, scope]
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
