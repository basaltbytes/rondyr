name: Deploy

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy prod
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The health check alone can wait 15 minutes for a new custom domain.
    timeout-minutes: 40
    concurrency:
      group: cloudflare-deploy-prod
      cancel-in-progress: false
    steps:
      - id: credentials
        name: Check deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RONDYR_PUBLIC_URL: ${{ vars.RONDYR_PUBLIC_URL_PROD || vars.BETTER_AUTH_URL_PROD }}
          RONDYR_SESSION_SECRET: ${{ secrets.RONDYR_SESSION_SECRET_PROD || secrets.BETTER_AUTH_SECRET_PROD }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::notice::Cloudflare deployment skipped because CLOUDFLARE_API_TOKEN is unset."
            exit 0
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || "$RONDYR_PUBLIC_URL" != https://* || ${#RONDYR_SESSION_SECRET} -lt 32 ]]; then
            echo "::error::Set CLOUDFLARE_ACCOUNT_ID, the HTTPS origin RONDYR_PUBLIC_URL_PROD (or legacy BETTER_AUTH_URL_PROD) and a RONDYR_SESSION_SECRET_PROD (or legacy BETTER_AUTH_SECRET_PROD) of at least 32 characters."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.credentials.outputs.ready == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.credentials.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.credentials.outputs.ready == 'true'
        name: Deploy through Alchemy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RONDYR_PUBLIC_URL: ${{ vars.RONDYR_PUBLIC_URL_PROD || vars.BETTER_AUTH_URL_PROD }}
          RONDYR_SESSION_SECRET: ${{ secrets.RONDYR_SESSION_SECRET_PROD || secrets.BETTER_AUTH_SECRET_PROD }}
          RONDYR_SETUP_TOKEN: ${{ secrets.RONDYR_SETUP_TOKEN_PROD }}
          RONDYR_RECOVERY_TOKEN: ${{ secrets.RONDYR_RECOVERY_TOKEN_PROD }}
          RONDYR_SECRETS_KEY: ${{ secrets.RONDYR_SECRETS_KEY_PROD }}
          RONDYR_CLASSIFIER: ${{ vars.RONDYR_CLASSIFIER_PROD }}
          RONDYR_ESCALATION_CLASSIFIER: ${{ vars.RONDYR_ESCALATION_CLASSIFIER_PROD }}
          RONDYR_EMAIL_PROVIDER: ${{ vars.RONDYR_EMAIL_PROVIDER_PROD }}
          RONDYR_EMAIL_FROM: ${{ vars.RONDYR_EMAIL_FROM_PROD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY_PROD }}
        run: |
          if [[ -z "$RONDYR_SETUP_TOKEN" ]]; then unset RONDYR_SETUP_TOKEN; fi
          if [[ -z "$RONDYR_RECOVERY_TOKEN" ]]; then unset RONDYR_RECOVERY_TOKEN; fi
          if [[ -z "$RONDYR_SECRETS_KEY" ]]; then unset RONDYR_SECRETS_KEY; fi
          if [[ -z "$RONDYR_CLASSIFIER" ]]; then unset RONDYR_CLASSIFIER; fi
          if [[ -z "$RONDYR_ESCALATION_CLASSIFIER" ]]; then unset RONDYR_ESCALATION_CLASSIFIER; fi
          if [[ -z "$RONDYR_EMAIL_PROVIDER" ]]; then unset RONDYR_EMAIL_PROVIDER; fi
          if [[ -z "$RONDYR_EMAIL_FROM" ]]; then unset RONDYR_EMAIL_FROM; fi
          if [[ -z "$RESEND_API_KEY" ]]; then unset RESEND_API_KEY; fi
          # The Alchemy path of docs/deployment.md, "Deploy with Alchemy and GitHub
          # Actions". The button's path deploys with Wrangler through Workers Builds instead.
          pnpm run deploy:alchemy --stage prod --yes --no-input
      - if: steps.credentials.outputs.ready == 'true'
        name: Check production health
        env:
          RONDYR_PUBLIC_URL: ${{ vars.RONDYR_PUBLIC_URL_PROD || vars.BETTER_AUTH_URL_PROD }}
        run: |
          # A first deployment on a new custom domain waits for its DNS record and certificate.
          if ! node apps/rondyr/scripts/smoke.mjs "$RONDYR_PUBLIC_URL" --health-timeout 900; then
            echo "::error title=Production health::prod is deployed, but its /health did not answer ok within 15 minutes. See docs/operations.md#production-health-check."
            exit 1
          fi
