name: Deploy docs

# Builds apps/docs and uploads it to the rondyr-docs Worker, as static assets. The address
# of the site is the repository variable RONDYR_DOCS_URL, for example
# https://docs.example.com (a custom domain in a zone of the account) or
# https://rondyr-docs.<subdomain>.workers.dev. Without it, the job is skipped with a notice.
# The job uses the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets that the Worker's
# deployment uses; apps/docs/README.md lists the permissions it needs.
#
# It runs when the site or the Markdown it renders changes. It never deploys the Rondyr
# Worker, and the Worker's deployment never deploys the site.
on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "docs/**"
      - "architecture.md"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "patches/lucode-starlight@*.patch"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

# A push during a deployment waits for it to finish instead of cancelling it.
concurrency:
  group: deploy-docs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy the documentation site
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: settings
        name: Check the site settings
        env:
          RONDYR_DOCS_URL: ${{ vars.RONDYR_DOCS_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$RONDYR_DOCS_URL" ]]; then
            echo "::notice title=Documentation site::Deployment skipped because the repository variable RONDYR_DOCS_URL is unset."
            exit 0
          fi
          if [[ "$RONDYR_DOCS_URL" != https://* || -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error title=Documentation site::RONDYR_DOCS_URL is set: also set the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, and give RONDYR_DOCS_URL as an HTTPS origin."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - if: steps.settings.outputs.ready == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - if: steps.settings.outputs.ready == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - if: steps.settings.outputs.ready == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.settings.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.settings.outputs.ready == 'true'
        name: Build and check the site
        env:
          RONDYR_DOCS_URL: ${{ vars.RONDYR_DOCS_URL }}
        run: pnpm --filter @rondyr/docs test
      - if: steps.settings.outputs.ready == 'true'
        name: Upload to Cloudflare
        env:
          RONDYR_DOCS_URL: ${{ vars.RONDYR_DOCS_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @rondyr/docs run deploy
