name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Quality checks and Worker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm deploy:dry

  # Which workspace packages changed, compared with the commit of the last successful
  # prod deployment (push) or the base of the pull request. Comparing with the last
  # deployment, not the previous commit, keeps a Worker change whose own run failed or
  # was cancelled in the next deployment. Pull request checks run on every package
  # anyway; on main, the result decides whether the Worker deploys. Read it in the job
  # log and in the run's notices.
  scope:
    name: Changed packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Read the earlier runs to find the last prod deployment.
      actions: read
    outputs:
      worker: ${{ steps.scope.outputs.worker }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The whole history, so the comparison commit is present.
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - id: scope
        name: Detect changed packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '--last-deployment' }}
        run: node scripts/deploy-scope.mjs "$BASE"

  dashboard-e2e:
    name: Dashboard browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: dashboard-browser-traces
          path: test-results/
          if-no-files-found: ignore

  production:
    # Deploys prod after both test jobs pass, then checks its /health. A push deploys
    # unless the scope job answered that the Worker package did not change: when that
    # job fails, the push deploys, as for any doubt.
    name: Production
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.check.result == 'success' && needs.dashboard-e2e.result == 'success' &&
      needs.scope.outputs.worker != 'false'
    needs: [check, dashboard-e2e, scope]
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
