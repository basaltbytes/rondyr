name: Deploy

on:
  workflow_call:
    inputs:
      stage:
        type: string
        required: true
      verify:
        description: Require the staging smoke test, and fail if its settings are missing
        type: boolean
        default: false
    outputs:
      verified:
        value: ${{ jobs.deploy.outputs.verified }}
  workflow_dispatch:
    inputs:
      stage:
        description: Cloudflare stage
        type: choice
        options: [staging, prod]
        default: staging

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.stage }}
    if: inputs.stage == 'staging' || (inputs.stage == 'prod' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: cloudflare-deploy-${{ inputs.stage }}
      cancel-in-progress: false
    outputs:
      verified: ${{ steps.smoke.outputs.verified }}
    steps:
      - id: credentials
        name: Check deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_URL: ${{ vars[format('BETTER_AUTH_URL_{0}', inputs.stage == 'prod' && 'PROD' || 'STAGING')] }}
          BETTER_AUTH_SECRET: ${{ secrets[format('BETTER_AUTH_SECRET_{0}', inputs.stage == 'prod' && 'PROD' || 'STAGING')] }}
          STAGE: ${{ inputs.stage }}
          VERIFY: ${{ inputs.verify && 'true' || 'false' }}
          RONDYR_SMOKE_ORGANIZATION_ID_STAGING: ${{ vars.RONDYR_SMOKE_ORGANIZATION_ID_STAGING }}
          RONDYR_SMOKE_FORM_ID_STAGING: ${{ vars.RONDYR_SMOKE_FORM_ID_STAGING }}
          RONDYR_SMOKE_EMAIL_STAGING: ${{ secrets.RONDYR_SMOKE_EMAIL_STAGING }}
          RONDYR_SMOKE_PASSWORD_STAGING: ${{ secrets.RONDYR_SMOKE_PASSWORD_STAGING }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::notice::Cloudflare deployment skipped because CLOUDFLARE_API_TOKEN is unset."
            exit 0
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || "$BETTER_AUTH_URL" != https://* || ${#BETTER_AUTH_SECRET} -lt 32 ]]; then
            echo "::error::Set CLOUDFLARE_ACCOUNT_ID, the stage HTTPS origin and a Better Auth secret of at least 32 characters."
            exit 1
          fi
          if [[ "$STAGE" == staging ]]; then
            # Print setting names only, never their values.
            missing=()
            for name in RONDYR_SMOKE_ORGANIZATION_ID_STAGING RONDYR_SMOKE_FORM_ID_STAGING RONDYR_SMOKE_EMAIL_STAGING RONDYR_SMOKE_PASSWORD_STAGING; do
              if [[ -z "${!name}" ]]; then missing+=("$name"); fi
            done
            if [[ ${#missing[@]} -eq 0 ]]; then
              echo "smoke=true" >> "$GITHUB_OUTPUT"
            elif [[ "$VERIFY" == true ]]; then
              echo "::error title=Staging gate::The staging smoke test is required but these settings are missing: ${missing[*]}. See docs/deployment.md#staging-gate."
              exit 1
            elif [[ ${#missing[@]} -eq 4 ]]; then
              echo "::notice title=Staging gate::Staging smoke test skipped because the staging gate is not configured. See docs/deployment.md#staging-gate."
            else
              echo "::warning title=Staging gate::Staging smoke test skipped because the staging gate is partly configured. Missing: ${missing[*]}. See docs/deployment.md#staging-gate."
            fi
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@v6
      - if: steps.credentials.outputs.ready == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.credentials.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.credentials.outputs.ready == 'true'
        name: Deploy through Alchemy
        env:
          STAGE: ${{ inputs.stage }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_URL: ${{ vars[format('BETTER_AUTH_URL_{0}', inputs.stage == 'prod' && 'PROD' || 'STAGING')] }}
          BETTER_AUTH_SECRET: ${{ secrets[format('BETTER_AUTH_SECRET_{0}', inputs.stage == 'prod' && 'PROD' || 'STAGING')] }}
          RONDYR_SETUP_TOKEN: ${{ secrets[format('RONDYR_SETUP_TOKEN_{0}', inputs.stage == 'prod' && 'PROD' || 'STAGING')] }}
          RONDYR_SECRETS_KEY: ${{ secrets[format('RONDYR_SECRETS_KEY_{0}', inputs.stage == 'prod' && 'PROD' || 'STAGING')] }}
          RONDYR_CLASSIFIER: ${{ vars[format('RONDYR_CLASSIFIER_{0}', inputs.stage == 'prod' && 'PROD' || 'STAGING')] }}
          RONDYR_EMAIL_PROVIDER: ${{ vars[format('RONDYR_EMAIL_PROVIDER_{0}', inputs.stage == 'prod' && 'PROD' || 'STAGING')] }}
          RONDYR_EMAIL_FROM: ${{ vars[format('RONDYR_EMAIL_FROM_{0}', inputs.stage == 'prod' && 'PROD' || 'STAGING')] }}
          RESEND_API_KEY: ${{ secrets[format('RESEND_API_KEY_{0}', inputs.stage == 'prod' && 'PROD' || 'STAGING')] }}
        run: |
          if [[ -z "$RONDYR_SETUP_TOKEN" ]]; then unset RONDYR_SETUP_TOKEN; fi
          if [[ -z "$RONDYR_SECRETS_KEY" ]]; then unset RONDYR_SECRETS_KEY; fi
          if [[ -z "$RONDYR_CLASSIFIER" ]]; then unset RONDYR_CLASSIFIER; fi
          if [[ -z "$RONDYR_EMAIL_PROVIDER" ]]; then unset RONDYR_EMAIL_PROVIDER; fi
          if [[ -z "$RONDYR_EMAIL_FROM" ]]; then unset RONDYR_EMAIL_FROM; fi
          if [[ -z "$RESEND_API_KEY" ]]; then unset RESEND_API_KEY; fi
          pnpm run deploy --stage "$STAGE" --yes --no-input
      - id: smoke
        if: steps.credentials.outputs.smoke == 'true'
        name: Verify staging health and submission processing
        env:
          BETTER_AUTH_URL_STAGING: ${{ vars.BETTER_AUTH_URL_STAGING }}
          RONDYR_SMOKE_ORGANIZATION_ID_STAGING: ${{ vars.RONDYR_SMOKE_ORGANIZATION_ID_STAGING }}
          RONDYR_SMOKE_FORM_ID_STAGING: ${{ vars.RONDYR_SMOKE_FORM_ID_STAGING }}
          RONDYR_SMOKE_EMAIL_STAGING: ${{ secrets.RONDYR_SMOKE_EMAIL_STAGING }}
          RONDYR_SMOKE_PASSWORD_STAGING: ${{ secrets.RONDYR_SMOKE_PASSWORD_STAGING }}
        run: |
          node scripts/smoke-staging.mjs
          echo "verified=true" >> "$GITHUB_OUTPUT"
