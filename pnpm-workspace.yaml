  - "apps/*"
  - "packages/*"
  - "tooling/*"

# Every dependency version of every workspace package, referenced as `catalog:` in the
# manifests. packages/emdash-plugin keeps real ranges in its dependencies and peer
# dependencies, because sites install it from outside the workspace.
catalog:
  "@alchemy.run/cloudflare": 2.0.0-beta.87
  "@alchemy.run/domain": 2.0.0-beta.87
  "@astrojs/markdown-remark": 7.3.10
  "@astrojs/starlight": 0.42.11
  "@astrojs/starlight-tailwind": 5.0.0
  "@babel/core": 8.1.3
  "@base-ui/react": 1.9.0
  "@changesets/changelog-github": 1.0.1
  "@changesets/cli": 3.0.3
  "@cloudflare/kumo": 2.15.0
  "@cloudflare/vite-plugin": 1.70.1
  "@cloudflare/vitest-plugin": 1.8.5
  "@effect/platform-node": 4.1.4
  "@effect/tsgo": 0.70.0
  "@effect/vitest": 4.1.4
  "@emdash-cms/plugin-forms": 0.2.13
  "@lobehub/icons-static-svg": 1.106.0
  "@oslojs/crypto": 1.0.1
  "@oslojs/webauthn": 1.0.0
  "@oxlint/plugins": 1.94.0
  "@playwright/test": 1.65.1
  "@rolldown/plugin-babel": 0.3.1
  "@shadcn/lint": 0.2.5
  "@tailwindcss/vite": 4.3.5
  "@tanstack/react-query": 5.108.4
  "@tanstack/react-router": 1.170.46
  "@tanstack/router-plugin": 1.169.0
  "@types/hast": 3.0.5
  "@types/mdast": 4.0.4
  "@types/node": 24.19.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.3.0
  alchemy: 2.0.0-beta.87
  astro: 7.4.13
  babel-plugin-react-compiler: 1.0.0
  class-variance-authority: 0.7.1
  cn: 0.5.2
  drizzle-kit: 1.0.0-rc.5
  drizzle-orm: 1.0.0-rc.5
  effect: 4.1.4
  emdash: 1.5.0
  github-slugger: 2.0.0
  hast-util-from-html: 2.1.0
  hast-util-to-string: 3.0.1
  i18next: 27.2.7
  i18next-cli: 1.95.1
  knip: 6.46.1
  lucide-react: 1.79.0
  lucode-starlight: 1.0.0
  mdast-util-from-markdown: 2.1.0
  mdast-util-to-string: 4.0.0
  miniflare: 5.20261118.0-beta
  oxfmt: 0.79.0
  oxlint: 1.94.0
  pele: 1.13.0
  react: 19.3.1
  react-dom: 19.3.1
  react-i18next: 18.0.3
  tailwindcss: 4.3.5
  typescript: 7.0.2
  unist-util-visit: 5.2.0
  vfile: 6.0.3
  vite: 8.3.8
  vitest: 5.1.1
  wrangler: 4.165.0

allowBuilds:
  "@swc/core": false
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - "@cloudflare/kv-asset-handler@0.5.1"
  - "@cloudflare/vite-plugin@1.70.1"
  - "@cloudflare/vitest-plugin@1.8.5"
  - "@cloudflare/workers-utils@0.55.0"
  - knip@6.46.1
  - miniflare@5.20261118.0-beta
  - wrangler@4.165.0
strictPeerDependencies: true
# @cloudflare/vite-plugin passes on the optional `workerd` peer of @cloudflare/unenv-preset.
# apps/rondyr has two workerd versions at the same depth, from wrangler and from
# @alchemy.run/cloudflare-runtime, and pnpm takes whichever its graph reaches first, so an
# unrelated workspace package could switch it. This pins it to the workerd of wrangler;
# scripts/workerd-peer.test.mjs fails when a wrangler update makes them differ.
packageExtensions:
  "@cloudflare/vite-plugin":
    dependencies:
      workerd: 1.20261118.1
peerDependencyRules:
  allowedVersions:
    "capnp-es@0.0.16>typescript": "7.0.2"
    "@cloudflare/unenv-preset@2.16.2>unenv": "2.0.0-rc.25"
patchedDependencies:
  "@alchemy.run/domain@2.0.0-beta.87": patches/@alchemy.run__domain@2.0.0-beta.87.patch
  # The same patch as usine.dev's docs: pagination links wrap on narrow screens instead of
  # widening the page, and the links of the mobile menu are 44 pixels high.
  lucode-starlight@1.0.0: patches/lucode-starlight@1.0.0.patch
